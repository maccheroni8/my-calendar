<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ブレックス × セレッソ 日程カレンダー 2026-27</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,'Hiragino Sans',sans-serif;background:#f0f2f5;color:#222;min-height:100vh;padding:20px}
.wrap{max-width:1200px;margin:0 auto}
h1{font-size:18px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
h1 span.b{color:#002B5C}h1 span.c{color:#E83D7A}

/* ── ツールバー ── */
.toolbar{background:#fff;border-radius:12px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.toolbar-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toolbar-right{display:flex;align-items:center;gap:8px}
.sep{width:1px;height:28px;background:#e0e0e0;margin:0 4px}

/* チップ */
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:2px solid transparent;transition:all .15s;user-select:none}
.chip.brex{background:#002B5C;color:#fff;border-color:#002B5C}
.chip.brex.off{background:transparent;color:#002B5C;border-color:#002B5C}
.chip.cerezo{background:#E83D7A;color:#fff;border-color:#E83D7A}
.chip.cerezo.off{background:transparent;color:#E83D7A;border-color:#E83D7A}
.chip.neutral{background:#555;color:#fff;border-color:#555;font-size:12px}
.chip.neutral:hover{background:#333}
.chip.japan{background:#CC0000;color:#fff;border-color:#CC0000}
.chip.japan.off{background:transparent;color:#CC0000;border-color:#CC0000}
.ev-japan{background:#CC0000;color:#fff}
.ev-japan.away{background:transparent;color:#CC0000;border:1.5px solid #CC0000}
.memo-save-btn.japan{background:#CC0000}
.memo-save-btn.japan:hover{background:#aa0000}

/* マークフィルタ */
.mf-btn{padding:5px 11px;border-radius:14px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid transparent;transition:all .14s;user-select:none;white-space:nowrap}
.mf-btn.all{background:#eee;color:#555;border-color:#ddd}
.mf-btn.all.active{background:#333;color:#fff;border-color:#333}
.mf-btn.go{background:#dcfce7;color:#166534;border-color:#86efac}
.mf-btn.go.active{background:#22c55e;color:#fff;border-color:#22c55e}
.mf-btn.maybe{background:#fef9c3;color:#854d0e;border-color:#fcd34d}
.mf-btn.maybe.active{background:#f59e0b;color:#fff;border-color:#f59e0b}
.mf-btn.price{background:#ede9fe;color:#5b21b6;border-color:#c4b5fd}
.mf-btn.price.active{background:#a78bfa;color:#fff;border-color:#a78bfa}

/* ビュー切替 */
.view-toggle{display:flex;border:1.5px solid #ddd;border-radius:8px;overflow:hidden;background:#f5f5f5}
.view-btn{padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;background:transparent;border:none;color:#888;transition:all .12s;white-space:nowrap}
.view-btn.active{background:#002B5C;color:#fff}

/* ── カレンダー ── */
#cal-view{}
.nav{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.nav button{background:#fff;border:1px solid #ccc;border-radius:8px;padding:6px 14px;cursor:pointer;font-size:15px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.nav button:hover{background:#f5f5f5}
.month-label{font-size:17px;font-weight:700;min-width:100px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:11px;font-weight:600;text-align:center;padding:6px 2px;color:#888}
.dow.sun{color:#E83D7A}.dow.sat{color:#002B5C}
.day-cell{min-height:80px;border-radius:8px;border:1px solid #e5e5e5;padding:5px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.day-cell.other-month{opacity:.35;background:#f5f5f5;box-shadow:none}
.day-cell.today{border-color:#E83D7A;border-width:2px}
.day-cell.marked-go{border:3px solid #22c55e;box-shadow:0 0 0 1px #22c55e33}
.day-cell.marked-maybe{border:3px solid #f59e0b;box-shadow:0 0 0 1px #f59e0b33}
.day-num{font-size:11px;font-weight:600;color:#aaa;margin-bottom:2px}
.day-num.sun{color:#E83D7A}.day-num.sat{color:#002B5C}
.event{border-radius:4px;padding:2px 5px;font-size:10px;font-weight:600;margin-bottom:2px;line-height:1.35;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:2px}
.event-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.ev-brex{background:#002B5C;color:#fff}
.ev-cerezo{background:#E83D7A;color:#fff}
.ev-brex.away{background:transparent;color:#002B5C;border:1.5px solid #002B5C}
.ev-cerezo.away{background:transparent;color:#E83D7A;border:1.5px solid #E83D7A}
.ev-cerezo.cup{background:#7c3aed;color:#fff}
.ev-cerezo.cup.away{background:transparent;color:#7c3aed;border:1.5px solid #7c3aed}
.ev-cerezo.cup.tbd{background:repeating-linear-gradient(45deg,#7c3aed,#7c3aed 6px,#9061f0 6px,#9061f0 12px);color:#fff}
.badge{font-size:9px;flex-shrink:0;border-radius:3px;padding:1px 3px;font-weight:700;line-height:1.4}
.badge-go{background:#22c55e;color:#fff}
.badge-maybe{background:#f59e0b;color:#fff}
.badge-price{background:#a78bfa;color:#fff}

/* ── リスト ── */
#list-view{display:none}

/* サマリーカード */
.summary-section{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.sum-card{background:#fff;border-radius:10px;padding:12px 16px;border:1px solid #e8e8e8;box-shadow:0 1px 4px rgba(0,0,0,.06);min-width:160px}
.sum-card-title{font-size:11px;font-weight:600;color:#888;margin-bottom:6px}
.sum-total-row{display:flex;align-items:baseline;gap:4px}
.sum-total{font-size:28px;font-weight:800;line-height:1;color:#222}
.sum-unit{font-size:12px;color:#aaa}
.sum-breakdown{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.sum-mini{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
.sum-go{background:#22c55e;color:#fff}
.sum-maybe{background:#f59e0b;color:#fff}
.sum-price{background:#a78bfa;color:#fff}
.sum-none{background:#eee;color:#aaa}

/* 月セクション */
.month-section{margin-bottom:20px}
.month-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#fff;border-radius:10px;margin-bottom:6px;border-left:4px solid #ccc;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.month-header h3{font-size:14px;font-weight:700;color:#444}
.month-counts{display:flex;gap:6px;align-items:center}
.month-total{font-size:12px;color:#999;margin-right:4px}

/* リスト行 */
.list-rows{display:flex;flex-direction:column;gap:4px}
.list-rows.horizontal{flex-direction:row;flex-wrap:wrap;gap:8px}

.list-row{background:#fff;border-radius:8px;padding:10px 14px;border:1px solid #eee;cursor:pointer;transition:all .12s;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.list-row:hover{border-color:#ccc;box-shadow:0 2px 8px rgba(0,0,0,.09)}

/* 縦リスト */
.list-rows:not(.horizontal) .list-row{display:flex;align-items:center;gap:10px}
.list-date{font-size:12px;font-weight:700;color:#666;min-width:90px;white-space:nowrap}
.list-team-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;white-space:nowrap;flex-shrink:0}
.ltb-brex{background:#002B5C;color:#fff}
.ltb-cerezo{background:#E83D7A;color:#fff}
.ltb-brex-away{background:transparent;color:#002B5C;border:1.5px solid #002B5C}
.ltb-cerezo-away{background:transparent;color:#E83D7A;border:1.5px solid #E83D7A}
.cup-badge{background:#7c3aed;color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;white-space:nowrap;flex-shrink:0}
.list-op{font-size:13px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-venue{font-size:11px;color:#bbb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;flex-shrink:0}
.list-mark{font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px;white-space:nowrap;flex-shrink:0}
.lm-go{background:#22c55e;color:#fff}
.lm-maybe{background:#f59e0b;color:#fff}
.lm-price{background:#a78bfa;color:#fff}
.lm-none{background:#f0f0f0;color:#bbb}

/* 横並びカード */
.list-rows.horizontal .list-row{width:calc(50% - 4px);min-width:220px;flex:1}
@media(max-width:700px){.list-rows.horizontal .list-row{width:100%}}
.list-rows.horizontal .list-date{font-size:11px;color:#888;margin-bottom:3px;display:block}
.list-rows.horizontal .list-card-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.list-rows.horizontal .list-op{font-size:13px;font-weight:600;color:#222;margin-top:2px;display:block;white-space:normal}
.list-rows.horizontal .list-venue{font-size:11px;color:#bbb;display:block;max-width:none;margin-top:2px}
.list-rows.horizontal .list-mark{display:inline-block;margin-top:5px}

/* 凡例 */
.legend-wrap{margin-top:14px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:12px;color:#777}
.leg-item{display:flex;align-items:center;gap:5px}
.leg-dot{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.leg-h-b{background:#002B5C}.leg-a-b{background:transparent;border:2px solid #002B5C}
.leg-h-c{background:#E83D7A}.leg-a-c{background:transparent;border:2px solid #E83D7A}
.legend-sep{width:1px;height:16px;background:#ddd}
.leg-badge{display:inline-block;border-radius:3px;padding:1px 5px;font-size:11px;font-weight:700;margin-right:2px}
.leg-go{background:#22c55e;color:#fff}.leg-maybe{background:#f59e0b;color:#fff}.leg-price{background:#a78bfa;color:#fff}

/* popup */
.mark-popup{display:none;position:fixed;background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px;z-index:1000;box-shadow:0 6px 20px rgba(0,0,0,.16);min-width:240px}
.mark-popup.show{display:block}
.mark-popup-title{font-size:11px;font-weight:700;color:#aaa;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.mark-popup-team{font-size:13px;font-weight:700;margin-bottom:6px}
.mark-popup-info{font-size:12px;color:#888;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #f0f0f0;line-height:1.6}
.mark-row{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:6px}
.mark-btn{padding:7px 6px;border-radius:7px;border:1.5px solid #e0e0e0;font-size:12px;font-weight:700;cursor:pointer;text-align:center;background:#fafafa;transition:all .12s}
.mark-btn:hover{filter:brightness(.93)}
.mark-btn.active-go{background:#22c55e;color:#fff;border-color:#22c55e}
.mark-btn.active-maybe{background:#f59e0b;color:#fff;border-color:#f59e0b}
.mark-btn.active-price{background:#a78bfa;color:#fff;border-color:#a78bfa}
.mark-btn.clear{grid-column:span 2;background:#fff;color:#ccc;border-color:#eee;font-size:11px}
.mark-btn.clear:hover{background:#fee2e2;color:#e03;border-color:#fca5a5}
.popup-close{width:100%;margin-top:6px;padding:6px;border:none;background:#f5f5f5;border-radius:7px;cursor:pointer;font-size:12px;color:#888}
.popup-close:hover{background:#eee}
/* メモ */
.memo-section{margin-top:8px;border-top:1px solid #f0f0f0;padding-top:8px}
.memo-label{font-size:11px;font-weight:700;color:#aaa;margin-bottom:4px;letter-spacing:.5px}
.memo-textarea{width:100%;border:1.5px solid #e0e0e0;border-radius:7px;padding:7px 9px;font-size:12px;font-family:inherit;resize:vertical;min-height:64px;line-height:1.5;color:#333;background:#fafafa;transition:border .12s;outline:none}
.memo-textarea:focus{border-color:#a78bfa;background:#fff}
.memo-save-row{display:flex;gap:5px;margin-top:5px}
.memo-save-btn{flex:1;padding:6px;border:none;border-radius:7px;background:#002B5C;color:#fff;font-size:12px;font-weight:700;cursor:pointer;transition:background .12s}
.memo-save-btn:hover{background:#003f8a}
.memo-save-btn.cerezo{background:#E83D7A}
.memo-save-btn.cerezo:hover{background:#c92d62}
.memo-clear-btn{padding:6px 10px;border:1.5px solid #eee;border-radius:7px;background:#fff;color:#ccc;font-size:12px;cursor:pointer}
.memo-clear-btn:hover{background:#fee2e2;color:#e03;border-color:#fca5a5}
.memo-saved-tag{font-size:10px;color:#22c55e;font-weight:700;opacity:0;transition:opacity .3s;margin-left:4px}

/* tooltip */
.tooltip{position:fixed;background:#fff;border:1px solid #ddd;border-radius:8px;padding:10px 14px;font-size:12px;color:#222;z-index:998;pointer-events:none;max-width:230px;box-shadow:0 4px 14px rgba(0,0,0,.13);display:none;line-height:1.7}

/* empty */
.empty-msg{text-align:center;padding:48px 20px;color:#ccc;font-size:14px}

/* layout toggle */
.layout-toggle{display:flex;border:1.5px solid #ddd;border-radius:8px;overflow:hidden;background:#f5f5f5}
.layout-btn{padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;background:transparent;border:none;color:#888;transition:all .12s}
.layout-btn.active{background:#555;color:#fff}

/* ── スマホ対応 ── */
@media(max-width:600px){
  body{padding:10px}
  h1{font-size:13px;gap:4px;flex-wrap:wrap;line-height:1.5}

  /* ツールバー：縦2段に */
  .toolbar{padding:10px 10px;gap:8px;flex-direction:column;align-items:stretch}
  .toolbar-left{gap:5px}
  .toolbar-right{justify-content:flex-end}
  .sep{display:none}

  /* チップを小さく */
  .chip{padding:5px 10px;font-size:11px}

  /* マークフィルタを横スクロール */
  .toolbar-left{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .mf-btn{padding:4px 9px;font-size:11px;white-space:nowrap;flex-shrink:0}

  /* ナビ */
  .nav{justify-content:center}
  .month-label{font-size:15px}
  .nav button{padding:5px 12px;font-size:14px}

  /* カレンダーグリッド：セルを小さく */
  .cal-grid{gap:2px}
  .dow{font-size:9px;padding:4px 1px}
  .day-cell{min-height:52px;padding:3px;border-radius:5px}
  .day-num{font-size:10px;margin-bottom:1px}
  .event{font-size:8px;padding:1px 3px;margin-bottom:1px;border-radius:3px}
  .badge{font-size:7px;padding:0 2px}

  /* ポップアップ：画面下部から全幅で表示 */
  .mark-popup{
    position:fixed!important;
    left:0!important;
    right:0!important;
    bottom:0!important;
    top:auto!important;
    width:100%!important;
    max-width:100%!important;
    border-radius:16px 16px 0 0;
    padding:16px;
    box-shadow:0 -4px 24px rgba(0,0,0,.18);
    max-height:85vh;
    overflow-y:auto;
  }
  /* ポップアップの上にドラッグバー風の装飾 */
  .mark-popup::before{
    content:'';display:block;width:36px;height:4px;
    background:#ddd;border-radius:2px;margin:0 auto 12px;
  }
  .mark-btn{padding:10px 6px;font-size:13px}
  .popup-close{padding:10px;font-size:13px}
  .memo-textarea{font-size:14px;min-height:72px}
  .memo-save-btn{padding:10px;font-size:13px}
  .memo-clear-btn{padding:10px 12px;font-size:13px}

  /* ツールチップはスマホでは非表示 */
  .tooltip{display:none!important}

  /* リストビュー */
  .summary-section{gap:8px}
  .sum-card{min-width:calc(50% - 4px);padding:10px 12px}
  .sum-total{font-size:22px}
  .list-rows:not(.horizontal) .list-row{flex-wrap:wrap;gap:6px}
  .list-date{min-width:unset;width:100%;font-size:11px}
  .list-op{font-size:12px}
  .list-venue{max-width:100%;font-size:10px}
  .list-rows.horizontal .list-row{width:100%}

  /* 凡例：2列グリッド */
  .legend-wrap{gap:8px}
  .leg-item{font-size:11px}
  .legend-sep{display:none}

  /* レイアウト切替を非表示（スマホは縦リスト固定） */
  #layout-toggle-wrap{display:none!important}
}

/* ポップアップ表示時にスクロール防止用オーバーレイ */
.popup-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:999}
.popup-overlay.show{display:block}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏀 <span class="b">宇都宮ブレックス</span> &amp; ⚽ <span class="c">セレッソ大阪</span> &amp; 🇯🇵 日本代表 2026-27</h1>

  <!-- ツールバー -->
  <div class="toolbar">
    <div class="toolbar-left">
      <div class="chip brex" id="chip-brex" onclick="toggleTeam('brex')">🏀 ブレックス</div>
      <div class="chip cerezo" id="chip-cerezo" onclick="toggleTeam('cerezo')">⚽ セレッソ</div>
      <div class="chip japan" id="chip-japan" onclick="toggleTeam('japan')">🇯🇵 日本代表</div>
      <div class="chip neutral" onclick="setAll()">すべて</div>
      <div class="sep"></div>
      <div class="mf-btn all active" id="mf-all" onclick="setMarkFilter('all')">すべて</div>
      <div class="mf-btn go" id="mf-go" onclick="setMarkFilter('go')">✅ 行く</div>
      <div class="mf-btn maybe" id="mf-maybe" onclick="setMarkFilter('maybe')">△ できたら</div>
      <div class="mf-btn price" id="mf-price" onclick="setMarkFilter('price')">¥ 値段次第</div>
    </div>
    <div class="toolbar-right">
      <div id="layout-toggle-wrap" style="display:none">
        <div class="layout-toggle">
          <button class="layout-btn active" id="lb-vert" onclick="setLayout('vert')">≡ 縦</button>
          <button class="layout-btn" id="lb-hori" onclick="setLayout('hori')">⊞ 横並び</button>
        </div>
      </div>
      <div class="view-toggle">
        <button class="view-btn active" id="vb-cal" onclick="setView('cal')">📅 カレンダー</button>
        <button class="view-btn" id="vb-list" onclick="setView('list')">📋 リスト</button>
      </div>
    </div>
  </div>

  <!-- カレンダービュー -->
  <div id="cal-view">
    <div class="nav">
      <button id="prev">&#8249;</button>
      <span class="month-label" id="month-label"></span>
      <button id="next">&#8250;</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="legend-wrap">
      <div class="leg-item"><div class="leg-dot leg-h-b"></div>ブレックス HOME</div>
      <div class="leg-item"><div class="leg-dot leg-a-b"></div>ブレックス AWAY</div>
      <div class="leg-item"><div class="leg-dot leg-h-c"></div>セレッソ HOME</div>
      <div class="leg-item"><div class="leg-dot leg-a-c"></div>セレッソ AWAY</div>
      <div class="leg-item"><div class="leg-dot" style="background:#7c3aed"></div>🏆 ルヴァンカップ</div>
      <div class="leg-item"><div class="leg-dot" style="background:#CC0000"></div>🇯🇵 日本代表</div>
      <div class="legend-sep"></div>
      <div class="leg-item"><span class="leg-badge leg-go">行く</span>絶対行く</div>
      <div class="leg-item"><span class="leg-badge leg-maybe">△</span>できたら</div>
      <div class="leg-item"><span class="leg-badge leg-price">¥</span>値段次第</div>
    </div>
  </div>

  <!-- リストビュー -->
  <div id="list-view">
    <div class="summary-section" id="summary-section"></div>
    <div id="list-body"></div>
  </div>
</div>

<!-- popup -->
<div class="popup-overlay" id="popup-overlay" onclick="closePopup()"></div>
<div class="mark-popup" id="mark-popup">
  <div class="mark-popup-title">観戦予定をマーク</div>
  <div class="mark-popup-team" id="popup-team-label"></div>
  <div class="mark-popup-info" id="popup-info"></div>
  <div class="mark-row">
    <div class="mark-btn" id="mb-go" onclick="setMark('go')">✅ 行く</div>
    <div class="mark-btn" id="mb-maybe" onclick="setMark('maybe')">△ できたら</div>
    <div class="mark-btn" id="mb-price" onclick="setMark('price')">¥ 値段次第</div>
    <div class="mark-btn clear" onclick="setMark(null)">✕ マークを消す</div>
  </div>
  <div class="memo-section">

let popupTarget=null;

function memoKey(t,d,i){return 'memo:'+t+':'+d+':'+i;}
function getMemo(t,d,i){try{return localStorage.getItem(memoKey(t,d,i))||'';}catch(e){return '';}}
function storeMemo(t,d,i,val){try{if(val)localStorage.setItem(memoKey(t,d,i),val);else localStorage.removeItem(memoKey(t,d,i));}catch(e){}}

function saveMemo(){
  if(!popupTarget)return;
  const{team,date,idx}=popupTarget;
  const val=document.getElementById('memo-textarea').value.trim();
  storeMemo(team,date,idx,val);
  const tag=document.getElementById('memo-saved-tag');
  tag.style.opacity='1';
  setTimeout(()=>tag.style.opacity='0',1800);
}
function clearMemo(){
  document.getElementById('memo-textarea').value='';
  saveMemo();
}
function getMark(t,d,i){return marks[markKey(t,d,i)]||null;}
function markKey(t,d,i){return t+':'+d+':'+i;}
function saveMark(t,d,i,val){
  const k=markKey(t,d,i);
  if(val)marks[k]=val; else delete marks[k];
  try{localStorage.setItem('cal_marks',JSON.stringify(marks));}catch(e){}
}
function loadMarks(){try{const s=localStorage.getItem('cal_marks');if(s)Object.assign(marks,JSON.parse(s));}catch(e){}}
function badgeLabel(m){return m==='go'?'行く':m==='maybe'?'△':m==='price'?'¥':'';}
function badgeClass(m){return m==='go'?'badge-go':m==='maybe'?'badge-maybe':m==='price'?'badge-price':'';}
function badgeColor(m){return m==='go'?'#22c55e':m==='maybe'?'#f59e0b':'#a78bfa';}

function allFilteredEvents(){
  const evs=[];
  if(showBrex) BREX.forEach((e,i)=>{
    const mv=getMark('brex',e.d,i);
    if(markFilter==='all'||mv===markFilter) evs.push({...e,team:'brex',origIdx:i,markVal:mv});
  });
  if(showCerezo) CEREZO.forEach((e,i)=>{
    const mv=getMark('cerezo',e.d,i);
    if(markFilter==='all'||mv===markFilter) evs.push({...e,team:'cerezo',origIdx:i,markVal:mv});
  });
  if(showJapan) JAPAN.forEach((e,i)=>{
    const mv=getMark('japan',e.d,i);
    if(markFilter==='all'||mv===markFilter) evs.push({...e,team:'japan',origIdx:i,markVal:mv});
  });
  return evs;
}

  if(t==='brex')showBrex=!showBrex;
  else if(t==='cerezo')showCerezo=!showCerezo;
  else showJapan=!showJapan;
  document.getElementById('chip-brex').classList.toggle('off',!showBrex);
  document.getElementById('chip-cerezo').classList.toggle('off',!showCerezo);
  document.getElementById('chip-japan').classList.toggle('off',!showJapan);
  renderCurrent();
}
function setAll(){
  showBrex=true;showCerezo=true;showJapan=true;
  document.getElementById('chip-brex').classList.remove('off');
  document.getElementById('chip-cerezo').classList.remove('off');
  document.getElementById('chip-japan').classList.remove('off');
  renderCurrent();
}
function setMarkFilter(f){
  markFilter=f;
  ['all','go','maybe','price'].forEach(v=>document.getElementById('mf-'+v).classList.toggle('active',v===f));
  renderCurrent();
}
function setView(v){
  curView=v;
  document.getElementById('cal-view').style.display=v==='cal'?'block':'none';
  document.getElementById('list-view').style.display=v==='list'?'block':'none';
  document.getElementById('layout-toggle-wrap').style.display=v==='list'?'block':'none';
  document.getElementById('vb-cal').classList.toggle('active',v==='cal');
  document.getElementById('vb-list').classList.toggle('active',v==='list');
  renderCurrent();
}
function setLayout(l){
  listLayout=l;
  document.getElementById('lb-vert').classList.toggle('active',l==='vert');
  document.getElementById('lb-hori').classList.toggle('active',l==='hori');
  renderList();
}
function renderCurrent(){if(curView==='cal')renderCal(); else renderList();}

// ── カレンダー ──
function renderCal(){
  document.getElementById('month-label').textContent=`${curYear}年${curMonth}月`;
  const grid=document.getElementById('cal-grid');
  grid.innerHTML='';
  DOW.forEach((d,i)=>{const el=document.createElement('div');el.className='dow'+(i===6?' sun':i===5?' sat':'');el.textContent=d;grid.appendChild(el);});
  const rawDay=new Date(curYear,curMonth-1,1).getDay(); // 0=Sun
  const firstDay=(rawDay===0?6:rawDay-1); // Mon=0 … Sun=6
  const dim=new Date(curYear,curMonth,0).getDate();
  const prevDays=new Date(curYear,curMonth-1,0).getDate();
  for(let i=0;i<firstDay;i++){const d=prevDays-firstDay+1+i;const[py,pm]=curMonth===1?[curYear-1,12]:[curYear,curMonth-1];grid.appendChild(makeCell(py,pm,d,true));}
  for(let d=1;d<=dim;d++)grid.appendChild(makeCell(curYear,curMonth,d,false));
  const rem=(7-(firstDay+dim)%7)%7;
  for(let d=1;d<=rem;d++){const[ny,nm]=curMonth===12?[curYear+1,1]:[curYear,curMonth+1];grid.appendChild(makeCell(ny,nm,d,true));}
}

function makeCell(y,m,d,other){
  const cell=document.createElement('div');
  const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const dow=new Date(y,m-1,d).getDay();
  const td=new Date();
  const isToday=y===td.getFullYear()&&m===(td.getMonth()+1)&&d===td.getDate();
  cell.className='day-cell'+(other?' other-month':'')+(isToday?' today':'');
  // その日のマークを確認して枠色クラスを付与（行く＞できたら の優先順）
  if(!other){
    const dayEvs=allFilteredEvents().filter(e=>e.d===ds);
    const hasGo=dayEvs.some(e=>e.markVal==='go');
    const hasMaybe=dayEvs.some(e=>e.markVal==='maybe');
    if(hasGo) cell.classList.add('marked-go');
    else if(hasMaybe) cell.classList.add('marked-maybe');
  }
  const num=document.createElement('div');
  num.className='day-num'+(dow===0?' sun':dow===6?' sat':''); // 0=Sun,6=Sat in JS Date
  num.textContent=d; cell.appendChild(num);
  allFilteredEvents().filter(e=>e.d===ds).forEach(ev=>{
    const tag=document.createElement('div');
    const isCup=!!ev.cup;
    const isJapan=ev.team==='japan';
    const isTbd=ev.h===null||ev.h===undefined;
    let cls=`event ev-${ev.team}`;
    if(isCup) cls+=' cup';
    else if(!isTbd&&!ev.h) cls+=' away';
    if(isCup&&isTbd) cls+=' tbd';
    tag.className=cls;
    const lbl=document.createElement('span');lbl.className='event-label';
    const icon=isJapan?(ev.sport==='⚽ サッカー'?'🇯🇵⚽':'🇯🇵🏀'):(ev.team==='brex'?'🏀':(isCup?'🏆':'⚽'));
    const hoa=isTbd?'':(ev.h?'H ':'A ');
    if(isJapan){
      lbl.textContent=`${icon} ${ev.competition} vs${ev.op}`;
    } else if(isCup){
      lbl.textContent=`${icon}${ev.cup}`;
    } else {
      lbl.textContent=`${icon}${hoa}${ev.op}`;
    }
    tag.appendChild(lbl);
    if(ev.markVal){const b=document.createElement('span');b.className='badge '+badgeClass(ev.markVal);b.textContent=badgeLabel(ev.markVal);tag.appendChild(b);}
    if(getMemo(ev.team,ds,ev.origIdx)){const m=document.createElement('span');m.className='badge';m.style.cssText='background:#f0e6ff;color:#7c3aed;font-size:9px';m.textContent='📝';tag.appendChild(m);}
    tag.addEventListener('click',e=>{e.stopPropagation();openPopup(e,ev.team,ds,ev.origIdx,isJapan?`${ev.competition} vs ${ev.op}`:(ev.cup||ev.op),ev.venue||ev.od||'');});
    tag.addEventListener('mouseenter',e=>showTip(e,ev));
    tag.addEventListener('mouseleave',hideTip);
    cell.appendChild(tag);
  });
  return cell;
}

// ── リスト ──
function renderList(){
  const evs=allFilteredEvents().sort((a,b)=>a.d.localeCompare(b.d));
  renderSummary(evs);
  renderListBody(evs);
}

function cnt(arr,fn){return arr.filter(fn).length;}

function renderSummary(evs){
  const sec=document.getElementById('summary-section');
  const bEvs=evs.filter(e=>e.team==='brex');
  const cEvs=evs.filter(e=>e.team==='cerezo');
  const jEvs=evs.filter(e=>e.team==='japan');

  function card(title,list,color){
    const go=cnt(list,e=>e.markVal==='go');
    const maybe=cnt(list,e=>e.markVal==='maybe');
    const price=cnt(list,e=>e.markVal==='price');
    const none=cnt(list,e=>!e.markVal);
    return `<div class="sum-card" style="${color?'border-top:4px solid '+color:''}">
      <div class="sum-card-title">${title}</div>
      <div class="sum-total-row"><span class="sum-total">${list.length}</span><span class="sum-unit">試合</span></div>
      <div class="sum-breakdown">
        ${go?`<span class="sum-mini sum-go">✅ 行く ${go}</span>`:''}
        ${maybe?`<span class="sum-mini sum-maybe">△ できたら ${maybe}</span>`:''}
        ${price?`<span class="sum-mini sum-price">¥ 値段次第 ${price}</span>`:''}
        ${none?`<span class="sum-mini sum-none">未定 ${none}</span>`:''}
      </div>
    </div>`;
  }
  let html=card('📊 シーズン合計',evs,'');
  if(showBrex) html+=card('🏀 宇都宮ブレックス',bEvs,'#002B5C');
  if(showCerezo) html+=card('⚽ セレッソ大阪',cEvs,'#E83D7A');
  if(showJapan) html+=card('🇯🇵 日本代表',jEvs,'#CC0000');
  sec.innerHTML=html;
}

function renderListBody(evs){
  const body=document.getElementById('list-body');
  body.innerHTML='';
  if(evs.length===0){body.innerHTML='<div class="empty-msg">該当する試合がありません</div>';return;}

  const byMonth={};
  evs.forEach(ev=>{const k=ev.d.slice(0,7);if(!byMonth[k])byMonth[k]=[];byMonth[k].push(ev);});

  Object.keys(byMonth).sort().forEach(ym=>{
    const[y,m]=ym.split('-');
    const mes=byMonth[ym];
    const go=cnt(mes,e=>e.markVal==='go');
    const maybe=cnt(mes,e=>e.markVal==='maybe');
    const price=cnt(mes,e=>e.markVal==='price');
    const none=cnt(mes,e=>!e.markVal);

    const sec=document.createElement('div');
    sec.className='month-section';

    const hdr=document.createElement('div');
    hdr.className='month-header';
    hdr.style.borderLeftColor=mes[0].team==='brex'&&mes.every(e=>e.team==='brex')?'#002B5C':mes[0].team==='cerezo'&&mes.every(e=>e.team==='cerezo')?'#E83D7A':'#888';
    hdr.innerHTML=`<h3>${y}年${MLABEL[parseInt(m)]} <span style="color:#bbb;font-weight:400;font-size:13px">（${mes.length}試合）</span></h3>
      <div class="month-counts">
        <span class="month-total">${mes.length}試合</span>
        ${go?`<span class="sum-mini sum-go">✅ ${go}</span>`:''}
        ${maybe?`<span class="sum-mini sum-maybe">△ ${maybe}</span>`:''}
        ${price?`<span class="sum-mini sum-price">¥ ${price}</span>`:''}
        ${none&&markFilter==='all'?`<span class="sum-mini sum-none">未 ${none}</span>`:''}
      </div>`;
    sec.appendChild(hdr);

    const rows=document.createElement('div');
    rows.className='list-rows'+(listLayout==='hori'?' horizontal':'');

    mes.forEach(ev=>{
      const dateObj=new Date(ev.d+'T00:00:00');
      const wd=DOW[dateObj.getDay()];
      const wdColor=dateObj.getDay()===0?'#E83D7A':dateObj.getDay()===6?'#002B5C':'#666'; // Sun=red,Sat=blue
      const isBrex=ev.team==='brex';
      const isCup=!!ev.cup;
      const isJapan=ev.team==='japan';
      const isTbd=ev.h===null||ev.h===undefined;
      let tbCls,tbLabel,opLabel,tbStyle='';
      if(isJapan){
        tbCls=''; tbStyle='style="background:#CC0000;color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;white-space:nowrap;flex-shrink:0"';
        tbLabel=`🇯🇵 ${ev.sport}`;
        opLabel=`${ev.competition} vs ${ev.op}`;
      } else if(isCup){
        tbCls='cup-badge'; tbLabel='🏆 '+ev.cup; opLabel=ev.op;
      } else {
        tbCls=isBrex?(isTbd?'ltb-brex':ev.h?'ltb-brex':'ltb-brex-away'):(isTbd?'ltb-cerezo':ev.h?'ltb-cerezo':'ltb-cerezo-away');
        tbLabel=(isBrex?'🏀 ブレックス':'⚽ セレッソ')+(isTbd?'':(ev.h?' HOME':' AWAY'));
        opLabel='vs '+ev.op;
      }
      const venue=ev.venue||ev.od||'';
      const markHtml=ev.markVal
        ?`<span class="list-mark lm-${ev.markVal}">${ev.markVal==='go'?'✅ 行く':ev.markVal==='maybe'?'△ できたら':'¥ 値段次第'}</span>`
        :`<span class="list-mark lm-none">未定</span>`;
      const memoText=getMemo(ev.team,ev.d,ev.origIdx);
      const memoHtml=memoText?`<div style="font-size:11px;color:#888;margin-top:4px;padding:4px 7px;background:#faf5ff;border-radius:5px;border-left:2px solid #a78bfa;white-space:pre-wrap;max-width:300px;overflow:hidden;text-overflow:ellipsis;">📝 ${memoText.slice(0,60)}${memoText.length>60?'…':''}</div>`:'';
      const dateStr=`${ev.d.slice(5).replace('-','/')}（${wd}）`;
      const clickOp=isJapan?`${ev.competition} vs ${ev.op}`:(ev.cup||ev.op);
      const clickVenue=ev.venue||ev.od||'';

      const row=document.createElement('div');
      row.className='list-row';
      if(listLayout==='hori'){
        row.innerHTML=`
          <span class="list-date" style="color:${wdColor}">${dateStr}</span>
          <div class="list-card-top">
            <span class="list-team-badge ${tbCls}" ${tbStyle}>${tbLabel}</span>
          </div>
          <span class="list-op">${opLabel}</span>
          <span class="list-venue">${venue}</span>
          ${markHtml}
          ${memoHtml}`;
      } else {
        row.innerHTML=`
          <div class="list-date" style="color:${wdColor}">${dateStr}</div>
          <span class="list-team-badge ${tbCls}" ${tbStyle}>${tbLabel}</span>
          <div class="list-op">${opLabel}</div>
          <div class="list-venue">${venue}</div>
          ${markHtml}
          ${memoHtml}`;
      }
      row.addEventListener('click',e=>openPopup(e,ev.team,ev.d,ev.origIdx,clickOp,clickVenue));
      rows.appendChild(row);
    });
    sec.appendChild(rows);
    body.appendChild(sec);
  });
}

// ── popup ──
function openPopup(e,team,date,idx,op,info){
  hideTip();
  popupTarget={team,date,idx};
  const popup=document.getElementById('mark-popup');
  const lbl=document.getElementById('popup-team-label');
  if(team==='japan'){
    lbl.textContent=op; // "キリンチャレンジカップ2026 vs 未定" がそのまま入る
    lbl.style.color='#CC0000';
  } else {
    lbl.textContent=(team==='brex'?'🏀 宇都宮ブレックス':'⚽ セレッソ大阪')+' vs '+op;
    lbl.style.color=team==='brex'?'#002B5C':'#E83D7A';
  }
  const infoEl=document.getElementById('popup-info');
  if(info){
    const timeMatch=info.match(/\d{1,2}:\d{2}/);
    if(timeMatch){
      const venue=info.replace(timeMatch[0],'').trim();
      infoEl.innerHTML=(venue?'📍 '+venue+'<br>':'')+'🕐 <strong>'+timeMatch[0]+'</strong> キックオフ';
    } else {
      infoEl.innerHTML='📍 '+info;
    }
    infoEl.style.display='block';
  } else {
    infoEl.style.display='none';
  }
  const cur=getMark(team,date,idx);
  ['go','maybe','price'].forEach(v=>document.getElementById('mb-'+v).className='mark-btn'+(cur===v?' active-'+v:''));
  // メモ読み込み
  document.getElementById('memo-textarea').value=getMemo(team,date,idx);
  document.getElementById('memo-saved-tag').style.opacity='0';
  const saveBtn=document.getElementById('memo-save-btn');
  saveBtn.className='memo-save-btn'+(team==='cerezo'?' cerezo':team==='japan'?' japan':'');
  // 一度 visibility:hidden で表示して実際の高さを測り、画面内に収める
  popup.style.visibility='hidden';
  popup.classList.add('show');
  document.getElementById('popup-overlay').classList.add('show');
  requestAnimationFrame(()=>{
    const isMobile=window.innerWidth<=600;
    if(!isMobile){
      const pw=popup.offsetWidth;
      const ph=popup.offsetHeight;
      const margin=10;
      let finalX=e.clientX+10;
      let finalY=e.clientY+10;
      if(finalX+pw>window.innerWidth-margin) finalX=e.clientX-pw-10;
      if(finalY+ph>window.innerHeight-margin) finalY=window.innerHeight-ph-margin;
      if(finalY<margin) finalY=margin;
      if(finalX<margin) finalX=margin;
      popup.style.left=finalX+'px';
      popup.style.top=finalY+'px';
    }
    popup.style.visibility='visible';
  });
}
function setMark(val){
  if(!popupTarget)return;
  saveMark(popupTarget.team,popupTarget.date,popupTarget.idx,val);
  closePopup();
  renderCurrent();
}
function closePopup(){
  document.getElementById('mark-popup').classList.remove('show');
  document.getElementById('popup-overlay').classList.remove('show');
  popupTarget=null;
}
document.addEventListener('click',e=>{
  const p=document.getElementById('mark-popup');
  if(p.classList.contains('show')&&!p.contains(e.target))closePopup();
},true);

// ── tooltip ──
const tip=document.getElementById('tooltip');
function showTip(e,ev){
  const isCup=!!ev.cup;
  const isJapan=ev.team==='japan';
  let title,sub;
  if(isJapan){
    title=`🇯🇵 日本代表 ${ev.sport}`;
    sub=`${ev.competition}<br>vs ${ev.op}`;
  } else if(isCup){
    title=`🏆 ${ev.cup}`;
    sub=ev.op;
  } else {
    title=ev.team==='brex'?'🏀 ブレックス':'⚽ セレッソ大阪';
    sub=`${ev.h===null||ev.h===undefined?'':ev.h?'HOME ':'AWAY '}vs ${ev.op}`;
  }
  const info=ev.venue||ev.od||'';
  tip.innerHTML=`<strong>${title}</strong><br>${sub}<br><span style="color:#aaa">${info}</span><br><span style="color:#ccc;font-size:11px">クリックでマーク</span>`;
  tip.style.display='block';
}
function moveTip(e){tip.style.left=Math.min(e.clientX+14,window.innerWidth-240)+'px';tip.style.top=Math.min(e.clientY+14,window.innerHeight-130)+'px';}
function hideTip(){tip.style.display='none';}
document.addEventListener('mousemove',e=>{if(tip.style.display!=='none')moveTip(e);});

document.getElementById('prev').onclick=()=>{curMonth--;if(curMonth<1){curMonth=12;curYear--;}renderCal();};
document.getElementById('next').onclick=()=>{curMonth++;if(curMonth>12){curMonth=1;curYear++;}renderCal();};

loadMarks();
const t=new Date();
curYear=t.getFullYear(); curMonth=t.getMonth()+1;
if(curYear<2026||(curYear===2026&&curMonth<8)){curYear=2026;curMonth=8;}
if(curYear>2027||(curYear===2027&&curMonth>6)){curYear=2027;curMonth=6;}
renderCal();
</script>
