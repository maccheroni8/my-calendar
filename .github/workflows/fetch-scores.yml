name: Fetch scores

on:
  schedule:
    # 毎日 0:10 JST (= 15:10 UTC 前日)
    - cron: '10 15 * * *'
  workflow_dispatch: {}

jobs:
  fetch-scores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run fetch-scores
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
