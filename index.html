<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>観戦カレンダー 2026-27</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Helvetica Neue',Arial,'Hiragino Sans',sans-serif;background:#f0f2f5;color:#222;min-height:100vh;padding:12px}
.wrap{max-width:1200px;margin:0 auto}
h1{font-size:15px;font-weight:700;margin-bottom:10px;line-height:1.5;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
h1 span.b{color:#002B5C}h1 span.c{color:#E83D7A}
.sync-bar{background:#e8f4fd;border:1px solid #bdd7f5;border-radius:8px;padding:7px 12px;margin-bottom:10px;font-size:11px;color:#1a6fa8;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sync-status{font-size:11px;font-weight:700}
.sync-status.ok{color:#22c55e}.sync-status.err{color:#e03}.sync-status.loading{color:#888}
.toolbar{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.toolbar-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.toolbar-row.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.toolbar-row.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:2px solid transparent;transition:all .15s;user-select:none;flex-shrink:0}
.chip.brex{background:#002B5C;color:#fff;border-color:#002B5C}
.chip.brex.off{background:transparent;color:#002B5C;border-color:#002B5C}
.chip.cerezo{background:#E83D7A;color:#fff;border-color:#E83D7A}
.chip.cerezo.off{background:transparent;color:#E83D7A;border-color:#E83D7A}
.chip.japan{background:#CC0000;color:#fff;border-color:#CC0000}
.chip.japan.off{background:transparent;color:#CC0000;border-color:#CC0000}
.chip.neutral{background:#555;color:#fff;font-size:11px}
.mf-btn{padding:5px 10px;border-radius:14px;font-size:11px;font-weight:700;cursor:pointer;border:2px solid transparent;user-select:none;white-space:nowrap;flex-shrink:0}
.mf-btn.all{background:#eee;color:#555;border-color:#ddd}
.mf-btn.all.active{background:#333;color:#fff;border-color:#333}
.mf-btn.go{background:#dcfce7;color:#166534;border-color:#86efac}
.mf-btn.go.active{background:#22c55e;color:#fff;border-color:#22c55e}
.mf-btn.maybe{background:#fef9c3;color:#854d0e;border-color:#fcd34d}
.mf-btn.maybe.active{background:#f59e0b;color:#fff;border-color:#f59e0b}
.mf-btn.price{background:#ede9fe;color:#5b21b6;border-color:#c4b5fd}
.mf-btn.price.active{background:#a78bfa;color:#fff;border-color:#a78bfa}
.toolbar-right{display:flex;align-items:center;gap:6px;justify-content:space-between}
.view-toggle{display:flex;border:1.5px solid #ddd;border-radius:8px;overflow:hidden;background:#f5f5f5}
.view-btn{padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;background:transparent;border:none;color:#888;white-space:nowrap}
.view-btn.active{background:#002B5C;color:#fff}
.layout-toggle{display:flex;border:1.5px solid #ddd;border-radius:8px;overflow:hidden;background:#f5f5f5}
.layout-btn{padding:5px 11px;font-size:11px;font-weight:700;cursor:pointer;background:transparent;border:none;color:#888}
.layout-btn.active{background:#555;color:#fff}
.nav{display:flex;align-items:center;gap:10px;margin-bottom:10px;justify-content:center}
.nav button{background:#fff;border:1px solid #ccc;border-radius:8px;padding:7px 16px;cursor:pointer;font-size:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.month-label{font-size:16px;font-weight:700;min-width:100px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{font-size:10px;font-weight:600;text-align:center;padding:5px 1px;color:#888}
.dow.sat{color:#002B5C}.dow.sun{color:#E83D7A}
.day-cell{min-height:70px;border-radius:6px;border:1px solid #e5e5e5;padding:4px;background:#fff}
.day-cell.other-month{opacity:.3;background:#f5f5f5}
.day-cell.today{border-color:#E83D7A;border-width:2px}
.day-cell.marked-go{border:3px solid #22c55e;box-shadow:0 0 0 1px #22c55e33}
.day-cell.marked-maybe{border:3px solid #f59e0b;box-shadow:0 0 0 1px #f59e0b33}
.day-num{font-size:10px;font-weight:600;color:#aaa;margin-bottom:2px}
.day-num.sat{color:#002B5C}.day-num.sun{color:#E83D7A}
.event{border-radius:3px;padding:2px 4px;font-size:9px;font-weight:600;margin-bottom:1px;line-height:1.3;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:1px}
.ev-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.ev-brex{background:#002B5C;color:#fff}
.ev-cerezo{background:#E83D7A;color:#fff}
.ev-japan{background:#CC0000;color:#fff}
.ev-brex.away{background:transparent;color:#002B5C;border:1px solid #002B5C}
.ev-cerezo.away{background:transparent;color:#E83D7A;border:1px solid #E83D7A}
.ev-japan.away{background:transparent;color:#CC0000;border:1px solid #CC0000}
.ev-cup{background:#7c3aed;color:#fff}
.badge{font-size:7px;flex-shrink:0;border-radius:2px;padding:0 2px;font-weight:700}
.bdg-go{background:#22c55e;color:#fff}.bdg-maybe{background:#f59e0b;color:#fff}.bdg-price{background:#a78bfa;color:#fff}
#list-view{display:none}
.summary-section{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sum-card{background:#fff;border-radius:10px;padding:10px 14px;border:1px solid #e8e8e8;box-shadow:0 1px 3px rgba(0,0,0,.06);flex:1;min-width:140px}
.sum-card-title{font-size:11px;font-weight:600;color:#888;margin-bottom:4px}
.sum-total{font-size:26px;font-weight:800;line-height:1}
.sum-breakdown{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.sum-mini{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px}
.s-go{background:#22c55e;color:#fff}.s-maybe{background:#f59e0b;color:#fff}
.s-price{background:#a78bfa;color:#fff}.s-none{background:#eee;color:#aaa}
.month-section{margin-bottom:16px}
.month-header{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:#fff;border-radius:8px;margin-bottom:5px;border-left:4px solid #ccc;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.month-header h3{font-size:13px;font-weight:700;color:#444}
.month-counts{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.list-rows{display:flex;flex-direction:column;gap:3px}
.list-rows.hori{flex-direction:row;flex-wrap:wrap;gap:8px}
.list-row{background:#fff;border-radius:8px;padding:9px 12px;border:1px solid #eee;cursor:pointer;transition:box-shadow .12s}
.list-row:hover{box-shadow:0 2px 8px rgba(0,0,0,.1)}
.list-rows:not(.hori) .list-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.list-rows.hori .list-row{flex:1;min-width:260px}
.l-date{font-size:11px;font-weight:700;white-space:nowrap}
.l-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;flex-shrink:0}
.lb-brex{background:#002B5C;color:#fff}.lb-cerezo{background:#E83D7A;color:#fff}
.lb-japan{background:#CC0000;color:#fff}.lb-brex-a{background:transparent;color:#002B5C;border:1.5px solid #002B5C}
.lb-cerezo-a{background:transparent;color:#E83D7A;border:1.5px solid #E83D7A}.lb-cup{background:#7c3aed;color:#fff}
.l-op{font-size:12px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l-venue{font-size:10px;color:#bbb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px;flex-shrink:0}
.l-mark{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;flex-shrink:0}
.lm-go{background:#22c55e;color:#fff}.lm-maybe{background:#f59e0b;color:#fff}
.lm-price{background:#a78bfa;color:#fff}.lm-none{background:#f0f0f0;color:#bbb}
.l-memo{font-size:10px;color:#888;margin-top:3px;padding:3px 6px;background:#faf5ff;border-radius:4px;border-left:2px solid #a78bfa;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.legend-wrap{margin-top:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:11px;color:#777}
.leg-item{display:flex;align-items:center;gap:4px}
.leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.empty-msg{text-align:center;padding:48px 20px;color:#ccc;font-size:14px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999}
.overlay.show{display:block}
.popup{display:none;position:fixed;background:#fff;border-radius:14px;padding:16px;z-index:1000;box-shadow:0 8px 32px rgba(0,0,0,.2);min-width:280px;max-width:360px;max-height:90vh;overflow-y:auto}
.popup.show{display:block}
.popup-handle{display:none;width:36px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 14px}
.popup-title-label{font-size:10px;font-weight:700;color:#aaa;margin-bottom:5px;letter-spacing:.5px;text-transform:uppercase}
.popup-team{font-size:13px;font-weight:700;margin-bottom:5px;line-height:1.4}
.popup-info{font-size:12px;color:#666;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #f0f0f0;line-height:1.7}
.mark-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.mark-btn{padding:10px 6px;border-radius:8px;border:1.5px solid #e0e0e0;font-size:12px;font-weight:700;cursor:pointer;text-align:center;background:#fafafa;transition:all .12s}
.mark-btn:hover{filter:brightness(.93)}
.mark-btn.active-go{background:#22c55e;color:#fff;border-color:#22c55e}
.mark-btn.active-maybe{background:#f59e0b;color:#fff;border-color:#f59e0b}
.mark-btn.active-price{background:#a78bfa;color:#fff;border-color:#a78bfa}
.mark-btn.clear{grid-column:span 2;background:#fff;color:#ccc;border-color:#eee;font-size:11px}
.mark-btn.clear:hover{background:#fee2e2;color:#e03;border-color:#fca5a5}
.memo-sec{margin-top:10px;border-top:1px solid #f0f0f0;padding-top:10px}
.memo-lbl{font-size:10px;font-weight:700;color:#aaa;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.memo-tag{font-size:10px;color:#22c55e;font-weight:700;opacity:0;transition:opacity .3s}
.memo-ta{width:100%;border:1.5px solid #e0e0e0;border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit;resize:vertical;min-height:72px;line-height:1.5;color:#333;background:#fafafa;outline:none}
.memo-ta:focus{border-color:#a78bfa;background:#fff}
.memo-row{display:flex;gap:6px;margin-top:6px}
.memo-save{flex:1;padding:10px;border:none;border-radius:8px;background:#002B5C;color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.memo-save.cerezo{background:#E83D7A}
.memo-save.japan{background:#CC0000}
.memo-clr{padding:10px 14px;border:1.5px solid #eee;border-radius:8px;background:#fff;color:#ccc;font-size:12px;cursor:pointer}
.memo-clr:hover{background:#fee2e2;color:#e03;border-color:#fca5a5}
.popup-close{width:100%;margin-top:8px;padding:10px;border:none;background:#f5f5f5;border-radius:8px;cursor:pointer;font-size:13px;color:#888}
.popup-close:hover{background:#eee}

@media(max-width:600px){
  body{padding:8px}
  h1{font-size:12px}
  .layout-toggle{display:none}

  /* ── ツールバー：2列グリッドに ── */
  .toolbar{padding:8px 10px;gap:6px}

  /* チーム行：3チーム＋すべて を横並び、小さく */
  .toolbar-row.team-row{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;flex-wrap:unset;overflow:visible}
  .toolbar-row.team-row .chip{padding:5px 4px;font-size:10px;justify-content:center;border-radius:16px}

  /* マークフィルタ行：4ボタン横並び */
  .toolbar-row.mark-row{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;flex-wrap:unset;overflow:visible}
  .toolbar-row.mark-row .mf-btn{padding:5px 2px;font-size:10px;text-align:center;border-radius:12px}

  /* カレンダー/リスト切替は右寄せ */
  .toolbar-right{justify-content:flex-end}
  .view-btn{padding:5px 10px;font-size:11px}

  /* ── カレンダー：横スクロール ── */
  .cal-scroll-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -8px;padding:0 8px}
  .cal-scroll-wrap::-webkit-scrollbar{display:none}
  .cal-scroll-inner{min-width:480px}

  /* セルは固定幅で読みやすく */
  .cal-scroll-inner .cal-grid{grid-template-columns:repeat(7,62px);gap:3px}
  .cal-scroll-inner .day-cell{min-height:68px;padding:3px}
  .cal-scroll-inner .event{font-size:9px;padding:2px 3px}
  .cal-scroll-inner .dow{font-size:10px;padding:5px 0}

  .sum-card{min-width:calc(50% - 4px)}
  .popup{position:fixed!important;left:0!important;right:0!important;bottom:0!important;top:auto!important;width:100%!important;max-width:100%!important;border-radius:18px 18px 0 0;max-height:88vh;overflow-y:auto;padding:16px 16px 32px}
  .popup-handle{display:block}
  .mark-btn{padding:12px 6px;font-size:13px}
  .memo-ta{font-size:16px}
  .memo-save,.memo-clr,.popup-close{padding:12px}
}
</style>

      </div>
    </div>
  </div>

  <div id="cal-view">

      <button id="prev">&#8249;</button>

      <button id="next">&#8250;</button>
    </div>
    <div class="cal-scroll-wrap">
      <div class="cal-scroll-inner">
        <div class="cal-grid" id="cal-grid"></div>
      </div>
    </div>
    <div class="legend-wrap">
      <div class="leg-item"><div class="leg-dot" style="background:#002B5C"></div>B HOME</div>

      <div class="leg-item"><div class="leg-dot" style="background:#E83D7A"></div>C HOME</div>
      <div class="leg-item"><div class="leg-dot" style="border:1.5px solid #E83D7A"></div>C AWAY</div>
      <div class="leg-item"><div class="leg-dot" style="background:#7c3aed"></div>ルヴァン</div>
      <div class="leg-item"><div class="leg-dot" style="background:#CC0000"></div>🇯🇵代表</div>
    </div>
  </div>

  <div id="list-view">
    <div class="summary-section" id="summary-section"></div>
    <div id="list-body"></div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div class="popup" id="popup">
  <div class="popup-handle"></div>
  <div class="popup-title-label">観戦予定をマーク</div>
  <div class="popup-team" id="popup-team"></div>
  <div class="popup-info" id="popup-info"></div>
  <div class="mark-row">
    <div class="mark-btn" id="mb-go" onclick="setMarkAction('go')">✅ 行く</div>
    <div class="mark-btn" id="mb-maybe" onclick="setMarkAction('maybe')">△ できたら</div>
    <div class="mark-btn" id="mb-price" onclick="setMarkAction('price')">¥ 値段次第</div>
    <div class="mark-btn clear" onclick="setMarkAction(null)">✕ マークを消す</div>
  </div>
  <div class="memo-sec">
    <div class="memo-lbl">📝 メモ <span class="memo-tag" id="memo-tag">保存しました ✓</span></div>
    <textarea class="memo-ta" id="memo-ta" placeholder="席、一緒に行く人、持ち物など…"></textarea>
    <div class="memo-row">
      <button class="memo-save" id="memo-save" onclick="saveMemo()">💾 メモを保存</button>
      <button class="memo-clr" onclick="clearMemo()">消す</button>
    </div>
  </div>
  <button class="popup-close" onclick="closePopup()">閉じる</button>
</div>

// ── Firebase 同期 ──
function setSyncStatus(msg, cls){
  const el=document.getElementById('sync-status');
  el.textContent=msg; el.className='sync-status '+cls;
}

// リアルタイム同期：他のデバイスで変更があれば自動反映
onSnapshot(DOC_REF, (snap)=>{
  if(snap.exists()){
    const data=snap.data();
    marks=data.marks||{};
    memos=data.memos||{};
    setSyncStatus('同期済み ✓','ok');
    renderCurrent();
  } else {
    setSyncStatus('新規データ','ok');
  }
}, (err)=>{
  setSyncStatus('接続エラー ⚠','err');
});

async function saveToFirebase(){
  try{
    setSyncStatus('保存中...','loading');
    await setDoc(DOC_REF, {marks, memos, updatedAt: new Date().toISOString()});
    setSyncStatus('保存しました ✓','ok');
  } catch(e){
    setSyncStatus('保存失敗 ⚠','err');
  }
}
function debouncedSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveToFirebase, 800);
}

// ── マーク・メモ ──
function mk(t,d,i){return t+'_'+d+'_'+i;}
function getMark(t,d,i){return marks[mk(t,d,i)]||null;}
function getMemo(t,d,i){return memos[mk(t,d,i)]||'';}
function badgeLbl(m){return m==='go'?'行く':m==='maybe'?'△':'¥';}
function bdgCls(m){return m==='go'?'bdg-go':m==='maybe'?'bdg-maybe':'bdg-price';}

// ── フィルタ・表示切替 ──
function allEvs(){
  const evs=[];
  if(showBrex) BREX.forEach((e,i)=>{const mv=getMark('brex',e.d,i);if(mf==='all'||mv===mf)evs.push({...e,team:'brex',idx:i,mv});});
  if(showCerezo) CEREZO.forEach((e,i)=>{const mv=getMark('cerezo',e.d,i);if(mf==='all'||mv===mf)evs.push({...e,team:'cerezo',idx:i,mv});});
  if(showJapan) JAPAN.forEach((e,i)=>{const mv=getMark('japan',e.d,i);if(mf==='all'||mv===mf)evs.push({...e,team:'japan',idx:i,mv});});
  return evs;
}
window.toggleTeam=function(t){
  if(t==='brex')showBrex=!showBrex;
  else if(t==='cerezo')showCerezo=!showCerezo;
  else showJapan=!showJapan;
  ['brex','cerezo','japan'].forEach(x=>document.getElementById('chip-'+x).classList.toggle('off',x==='brex'?!showBrex:x==='cerezo'?!showCerezo:!showJapan));

};

// ── カレンダー ──
function renderCal(){
  document.getElementById('month-label').textContent=`${curY}年${curM}月`;
  const grid=document.getElementById('cal-grid');
  grid.innerHTML='';
  DOW.forEach((d,i)=>{const el=document.createElement('div');el.className='dow'+(i===5?' sat':i===6?' sun':'');el.textContent=d;grid.appendChild(el);});
  const rawDay=new Date(curY,curM-1,1).getDay();
  const firstDay=rawDay===0?6:rawDay-1;
  const dim=new Date(curY,curM,0).getDate();
  const prevDays=new Date(curY,curM-1,0).getDate();
  for(let i=0;i<firstDay;i++){const d=prevDays-firstDay+1+i;const[py,pm]=curM===1?[curY-1,12]:[curY,curM-1];grid.appendChild(makeCell(py,pm,d,true));}
  for(let d=1;d<=dim;d++)grid.appendChild(makeCell(curY,curM,d,false));
  const rem=(7-(firstDay+dim)%7)%7;
  for(let d=1;d<=rem;d++){const[ny,nm]=curM===12?[curY+1,1]:[curY,curM+1];grid.appendChild(makeCell(ny,nm,d,true));}
}
function makeCell(y,m,d,other){
  const cell=document.createElement('div');
  const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const dow=new Date(y,m-1,d).getDay();
  const td=new Date();
  const isToday=y===td.getFullYear()&&m===td.getMonth()+1&&d===td.getDate();
  cell.className='day-cell'+(other?' other-month':'')+(isToday?' today':'');
  if(!other){
    const de=allEvs().filter(e=>e.d===ds);
    if(de.some(e=>e.mv==='go'))cell.classList.add('marked-go');
    else if(de.some(e=>e.mv==='maybe'))cell.classList.add('marked-maybe');
  }
  const num=document.createElement('div');
  num.className='day-num'+(dow===0?' sun':dow===6?' sat':'');
  num.textContent=d; cell.appendChild(num);
  allEvs().filter(e=>e.d===ds).forEach(ev=>{
    const tag=document.createElement('div');
    const isCup=!!ev.cup,isJP=ev.team==='japan',isTbd=ev.h===null||ev.h===undefined;
    let cls='event ';
    if(isJP)cls+='ev-japan'+(isTbd?'':(ev.h?'':' away'));
    else if(isCup)cls+='ev-cup';
    else cls+=`ev-${ev.team}`+(isTbd?'':(ev.h?'':' away'));
    tag.className=cls;
    const lbl=document.createElement('span');lbl.className='ev-label';
    const icon=isJP?(ev.sport==='⚽ サッカー'?'🇯🇵⚽':'🇯🇵🏀'):(ev.team==='brex'?'🏀':(isCup?'🏆':'⚽'));
    const hoa=isTbd?'':(ev.h?'H ':'A ');
    lbl.textContent=isJP?`${icon}${ev.competition}`:isCup?`${icon}${ev.cup}`:`${icon}${hoa}${ev.op}`;
    tag.appendChild(lbl);
    if(ev.mv){const b=document.createElement('span');b.className='badge '+bdgCls(ev.mv);b.textContent=badgeLbl(ev.mv);tag.appendChild(b);}
    if(getMemo(ev.team,ds,ev.idx)){const m2=document.createElement('span');m2.className='badge';m2.style.cssText='background:#f0e6ff;color:#7c3aed';m2.textContent='📝';tag.appendChild(m2);}
    const clickOp=isJP?`${ev.competition} vs ${ev.op}`:(ev.cup||ev.op);
    tag.addEventListener('click',e=>{e.stopPropagation();openPopup(e,ev.team,ds,ev.idx,clickOp,ev.venue||'');});
    cell.appendChild(tag);
  });
  return cell;
}

// ── リスト ──
function renderList(){
  const evs=allEvs().sort((a,b)=>a.d.localeCompare(b.d));
  const sec=document.getElementById('summary-section');
  function card(title,list,color){
    const go=list.filter(e=>e.mv==='go').length,maybe=list.filter(e=>e.mv==='maybe').length,
      price=list.filter(e=>e.mv==='price').length,none=list.filter(e=>!e.mv).length;
    return `<div class="sum-card" style="${color?'border-top:4px solid '+color:''}">
      <div class="sum-card-title">${title}</div>
      <div style="display:flex;align-items:baseline;gap:4px"><span class="sum-total">${list.length}</span><span style="font-size:12px;color:#aaa">試合</span></div>
      <div class="sum-breakdown">
        ${go?`<span class="sum-mini s-go">✅ ${go}</span>`:''}
        ${maybe?`<span class="sum-mini s-maybe">△ ${maybe}</span>`:''}
        ${price?`<span class="sum-mini s-price">¥ ${price}</span>`:''}
        ${none&&mf==='all'?`<span class="sum-mini s-none">未 ${none}</span>`:''}
      </div></div>`;
  }
  let html=card('📊 合計',evs,'');
  if(showBrex)html+=card('🏀 ブレックス',evs.filter(e=>e.team==='brex'),'#002B5C');
  if(showCerezo)html+=card('⚽ セレッソ',evs.filter(e=>e.team==='cerezo'),'#E83D7A');
  if(showJapan)html+=card('🇯🇵 日本代表',evs.filter(e=>e.team==='japan'),'#CC0000');
  sec.innerHTML=html;
  const body=document.getElementById('list-body');
  body.innerHTML='';
  if(!evs.length){body.innerHTML='<div class="empty-msg">該当なし</div>';return;}
  const byM={};
  evs.forEach(ev=>{const k=ev.d.slice(0,7);if(!byM[k])byM[k]=[];byM[k].push(ev);});
  Object.keys(byM).sort().forEach(ym=>{
    const[y,m]=ym.split('-');
    const mes=byM[ym];
    const go=mes.filter(e=>e.mv==='go').length,maybe=mes.filter(e=>e.mv==='maybe').length,price=mes.filter(e=>e.mv==='price').length,none=mes.filter(e=>!e.mv).length;
    const msec=document.createElement('div');msec.className='month-section';
    const hdr=document.createElement('div');hdr.className='month-header';
    hdr.innerHTML=`<h3>${y}年${ML[parseInt(m)]} <span style="color:#bbb;font-weight:400;font-size:12px">（${mes.length}試合）</span></h3>
      <div class="month-counts">
        ${go?`<span class="sum-mini s-go">✅ ${go}</span>`:''}
        ${maybe?`<span class="sum-mini s-maybe">△ ${maybe}</span>`:''}
        ${price?`<span class="sum-mini s-price">¥ ${price}</span>`:''}
        ${none&&mf==='all'?`<span class="sum-mini s-none">未 ${none}</span>`:''}
      </div>`;
    msec.appendChild(hdr);
    const rows=document.createElement('div');
    rows.className='list-rows'+(layout==='hori'?' hori':'');
    mes.forEach(ev=>{
      const dow2=DOW[new Date(ev.d+'T00:00:00').getDay()];
      const wC=new Date(ev.d+'T00:00:00').getDay()===0?'#E83D7A':new Date(ev.d+'T00:00:00').getDay()===6?'#002B5C':'#666';
      const dateStr=`${ev.d.slice(5).replace('-','/')}（${dow2}）`;
      const isCup=!!ev.cup,isJP=ev.team==='japan',isTbd=ev.h===null||ev.h===undefined;
      let badgeCl,badgeTx,opTx;
      if(isJP){badgeCl='l-badge lb-japan';badgeTx=`🇯🇵 ${ev.sport}`;opTx=`${ev.competition} vs ${ev.op}`;}
      else if(isCup){badgeCl='l-badge lb-cup';badgeTx='🏆 '+ev.cup;opTx=ev.op;}
      else{const isB=ev.team==='brex';badgeCl='l-badge '+(isB?(ev.h?'lb-brex':'lb-brex-a'):(ev.h?'lb-cerezo':'lb-cerezo-a'));badgeTx=(isB?'🏀':'⚽')+(isTbd?'':(ev.h?' H':' A'));opTx='vs '+ev.op;}
      const markHtml=ev.mv?`<span class="l-mark lm-${ev.mv}">${ev.mv==='go'?'✅ 行く':ev.mv==='maybe'?'△ できたら':'¥ 値段次第'}</span>`:`<span class="l-mark lm-none">未定</span>`;
      const memo=getMemo(ev.team,ev.d,ev.idx);
      const memoHtml=memo?`<div class="l-memo">📝 ${memo.slice(0,60)}${memo.length>60?'…':''}</div>`:'';
      const row=document.createElement('div');row.className='list-row';
      const clickOp=isJP?`${ev.competition} vs ${ev.op}`:(ev.cup||ev.op);
      if(layout==='hori'){
        row.innerHTML=`<span class="l-date" style="color:${wC};display:block;margin-bottom:4px">${dateStr}</span>
          <div style="margin-bottom:4px"><span class="${badgeCl}">${badgeTx}</span></div>
          <div style="font-size:12px;font-weight:500;margin-bottom:2px">${opTx}</div>
          <div style="font-size:10px;color:#bbb;margin-bottom:4px">${ev.venue||''}</div>
          ${markHtml}${memoHtml}`;
      } else {
        row.innerHTML=`<div class="l-date" style="color:${wC}">${dateStr}</div>
          <span class="${badgeCl}">${badgeTx}</span>
          <div class="l-op">${opTx}</div>
          <div class="l-venue">${ev.venue||''}</div>
          ${markHtml}${memoHtml}`;
      }
      row.addEventListener('click',e=>openPopup(e,ev.team,ev.d,ev.idx,clickOp,ev.venue||''));
      rows.appendChild(row);
    });
    msec.appendChild(rows);body.appendChild(msec);
  });
}

// ── ポップアップ ──
function openPopup(e,team,date,idx,op,info){
  popupTarget={team,date,idx};
  const popup=document.getElementById('popup');
  const tEl=document.getElementById('popup-team');
  if(team==='japan'){tEl.textContent=op;tEl.style.color='#CC0000';}
  else{tEl.textContent=(team==='brex'?'🏀 宇都宮ブレックス':'⚽ セレッソ大阪')+' vs '+op;tEl.style.color=team==='brex'?'#002B5C':'#E83D7A';}
  const infoEl=document.getElementById('popup-info');
  if(info){const tm=info.match(/\d{1,2}:\d{2}/);infoEl.innerHTML=(tm?`🕐 <strong>${tm[0]}</strong> キックオフ<br>`:'')+'📍 '+(tm?info.replace(tm[0],'').trim():info);infoEl.style.display='block';}
  else infoEl.style.display='none';
  const cur=getMark(team,date,idx);
  ['go','maybe','price'].forEach(v=>document.getElementById('mb-'+v).className='mark-btn'+(cur===v?' active-'+v:''));
  document.getElementById('memo-ta').value=getMemo(team,date,idx);
  document.getElementById('memo-tag').style.opacity='0';
  document.getElementById('memo-save').className='memo-save'+(team==='cerezo'?' cerezo':team==='japan'?' japan':'');
  const isMobile=window.innerWidth<=600;
  popup.style.visibility='hidden';
  document.getElementById('overlay').classList.add('show');
  popup.classList.add('show');
  requestAnimationFrame(()=>{
    if(!isMobile){
      const pw=popup.offsetWidth,ph=popup.offsetHeight,mg=10;
      let fx=e.clientX+10,fy=e.clientY+10;
      if(fx+pw>window.innerWidth-mg)fx=e.clientX-pw-10;
      if(fy+ph>window.innerHeight-mg)fy=window.innerHeight-ph-mg;
      if(fy<mg)fy=mg;if(fx<mg)fx=mg;
      popup.style.left=fx+'px';popup.style.top=fy+'px';
    }
    popup.style.visibility='visible';
  });
}
window.closePopup=function(){
  document.getElementById('popup').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
  popupTarget=null;
};
document.addEventListener('click',e=>{
  const p=document.getElementById('popup');
  if(p.classList.contains('show')&&!p.contains(e.target)&&e.target!==document.getElementById('overlay'))window.closePopup();
},true);
window.setMarkAction=function(v){
  if(!popupTarget)return;
  const{team,date,idx}=popupTarget;
  if(v)marks[mk(team,date,idx)]=v; else delete marks[mk(team,date,idx)];
  debouncedSave();
  window.closePopup();renderCurrent();
};
window.saveMemo=function(){
  if(!popupTarget)return;
  const{team,date,idx}=popupTarget;
  const v=document.getElementById('memo-ta').value.trim();
  if(v)memos[mk(team,date,idx)]=v; else delete memos[mk(team,date,idx)];
  debouncedSave();
  const tag=document.getElementById('memo-tag');
  tag.style.opacity='1';setTimeout(()=>tag.style.opacity='0',1800);
  renderCurrent();
};
window.clearMemo=function(){document.getElementById('memo-ta').value='';window.saveMemo();};

// ── ナビ ──
document.getElementById('prev').onclick=()=>{curM--;if(curM<1){curM=12;curY--;}renderCal();};
document.getElementById('next').onclick=()=>{curM++;if(curM>12){curM=1;curY++;}renderCal();};

// ── 初期化 ──
const t2=new Date();
curY=t2.getFullYear();curM=t2.getMonth()+1;
if(curY<2026||(curY===2026&&curM<8)){curY=2026;curM=8;}
if(curY>2027||(curY===2027&&curM>6)){curY=2027;curM=6;}
renderCal();
</script>
