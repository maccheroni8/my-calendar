name: Fetch scores

permissions:
  contents: read

on:
  schedule:
    # 毎日 0:10 JST (= 15:10 UTC 前日)
    - cron: '10 15 * * *'
  workflow_dispatch:
    inputs:
      expected_counts:
        description: 'Expected counts JSON: brex, cerezo, japan_basket, japan_soccer'
        required: true
        type: string

jobs:
  fetch-scores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          package-manager-cache: false

      - run: npm ci --ignore-scripts

      - run: npm run fetch-scores
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EXPECTED_COUNTS: ${{ inputs.expected_counts }}
